[project]
name = "vunit-mcp"
version = "0.1.0"
description = "MCP server for driving VUnit (HDL unit-testing) projects: list, compile, run tests, inspect logs and reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # FastMCP (mcp.server.fastmcp) was removed in mcp 2.x — pin to 1.x.
    "mcp>=1.0,<2",
    "pydantic>=2.0",
    # vunit-hdl: vunit_test_dependencies builds an in-process project model,
    # and the --wave waveform flag (upstream PR #1101) needs a patched VUnit.
    # This fork = VUnit 5.0.0.dev12 + PR #1101, pinned to the exact commit so
    # --wave is always present; bump the pin when the fork moves on.
    # project_model uses VUnit's private API (VUnitCLI.parse_args,
    # VUnit.from_args, get_implementation_subset), which 5.0 has changed
    # against 4.x — keep the fork pin and re-verify on any VUnit update.
    "vunit-hdl @ git+https://github.com/ru551n/vunit.git@6304bcf2c80b239077d44aeb52e37c8924047a68",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
vunit-mcp = "vunit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]
