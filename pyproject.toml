[project]
name = "vunit-mcp"
version = "0.1.0"
description = "MCP server for driving VUnit (HDL unit-testing) projects: list, compile, run tests, inspect logs and reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # FastMCP (mcp.server.fastmcp) was removed in mcp 2.x — pin to 1.x.
    "mcp>=1.0,<2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
vunit-mcp = "vunit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]
